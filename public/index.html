<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Chatting  App</title>
    <style>
        ul{
            list-style: none;
        }

    </style>
</head>
<body>
    <h1 class="display-6 text-center mt-4 p-2">mann ki baat mera shivji ke sath</h1>
    <section id="login" class="border mx-auto" style="width: 300px;">
        <div>
            
            <div class="d-grid gap-2 col-6 mx-auto">
                <input class=" form-control" type="text" name="" id="username" placeholder="enter your name">
                <button id="login-btn" class="btn btn-dark" type="button">Login</button>
            </div>
        </div>

    </section>

    <section class="border mx-auto p-2" style="width: 300px;" id="chat-box">
        <ul id="chat" class="overflow-auto ps-0" style="height: 300px;">
            <li class="border mb-2 p-2 roundedpill"><spam class="fw-bold">Samarth:</spam> ->hello there friend</li>
            
        </ul>


        <textarea name="form-control" id="inp" rows="4" placeholder="enter you msg"></textarea>
        <button class="btn btn-md btn-dark m-2" id="send-btn">Send</button>

    </section>











    <!-- bootstrap-2 -->
